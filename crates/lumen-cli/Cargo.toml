[package]
name = "lumen-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lumen-cli"
path = "src/main.rs"

[dependencies]
lumen-core.workspace = true
lumen-provider.workspace = true
lumen-downloader.workspace = true
lumen-setter.workspace = true
lumen-db.workspace = true
# For the wire format a downloaded file's sidecar is written in: the app reads
# that sidecar, so there is one definition of it rather than two.
lumen-ffi = { path = "../lumen-ffi" }

clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
directories.workspace = true
indicatif.workspace = true
chrono.workspace = true
reqwest.workspace = true
uuid.workspace = true
rand = "0.8"
libc = "0.2"
futures.workspace = true
