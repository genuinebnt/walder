[workspace]
members = [
    "crates/lumen-core",
    "crates/lumen-provider",
    "crates/lumen-downloader",
    "crates/lumen-setter",
    "crates/lumen-db",
    "crates/lumen-cli",
    "crates/lumen-ffi",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["genuinebasilnt"]

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# CLI
clap = { version = "4", features = ["derive"] }

# Image
image = "0.25"

# Wallpaper
wallpaper = "3.2"

# Directories
directories = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
futures = "0.3"
bytes = "1"
indicatif = "0.17"

# Internal crates
lumen-core = { path = "crates/lumen-core" }
lumen-provider = { path = "crates/lumen-provider" }
lumen-downloader = { path = "crates/lumen-downloader" }
lumen-setter = { path = "crates/lumen-setter" }
lumen-db = { path = "crates/lumen-db" }
